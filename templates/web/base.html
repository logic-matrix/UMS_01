<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KKBAU</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            overflow-x: hidden;
            background-color: #fdfdfd;
            color: #333;
        }

        /* Top Nav */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #0f1c50;
            color: white;
            padding: 5px 40px;
            font-size: 0.9rem;
        }

        .top-nav a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }

        /* Main Nav */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1E2A78;
            color: white;
            padding: 12px 40px;
            position: sticky;
            top: 0;
            width: 100%;
            z-index: 10;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .dropdown {
            position: relative;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 35px;
            background: #1E2A78;
            flex-direction: column;
            min-width: 180px;
            border-radius: 6px;
        }

        .dropdown-content a {
            padding: 10px 15px;
        }

        .dropdown:hover .dropdown-content {
            display: flex;
        }

        .login-btn {
            background: #FF6B6B;
            border: none;
            color: white;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 6px;
        }

        .login-btn:hover {
            background: #FF4B4B;
        }

        /* Footer */
        footer {
            background-color: #1E2A78;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 0.9rem;
        }

        .menu-toggle {
            display: none;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .menu-toggle {
                display: block;
                color: white;
                font-size: 1.4rem;
            }

            .nav-links {
                display: none;
                flex-direction: column;
                width: 100%;
                background: #1E2A78;
                position: absolute;
                top: 60px;
                left: 0;
            }

            .nav-links.active {
                display: flex;
            }
        }
    </style>
</head>

<body>
    <!-- Top Navbar -->
    <div class="top-nav">
        <div>📞 +880 1234 567890 | ✉ info@kkbau.edu</div>
        <div>
            <a href="#">Alumni</a>
            <a href="#">Students</a>
            <a href="#">Staff</a>
        </div>
    </div>

    <!-- Main Navbar -->
    <nav>
        <div class="logo">Khulna Khan Bahadur Ahsanullah University</div>
        <div class="menu-toggle" onclick="toggleMenu()">☰</div>
        <div class="nav-links" id="menu">
            <a href="/">Home</a>
            <a href="/about/">About</a>
            <div class="dropdown">
                <a href="#">Administration ▼</a>
                <div class="dropdown-content">
                    <a href="#">Vice Chancellor</a>
                    <a href="#">Registrar</a>
                    <a href="#">Departments</a>
                </div>
            </div>
            <a href="/academic">Academic</a>
            <a href="/admission">Admission</a>
            <a href="/career">Career</a>
            <a href="/contact">Contact</a>
            <button class="login-btn" onclick="window.location.href='/admin/login'">Login</button>
        </div>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        &copy; 2025 KKBAU. All Rights Reserved.
    </footer>

    <script>
        function toggleMenu() {
            document.getElementById('menu').classList.toggle('active');
        }
    </script>
</body>

</html>
